
name: TreasureHunt - Source ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Java Source Files
        shell: bash
        run: |
          echo "Suche Java-Dateien..."

          find . -type f -name "*.java" \
            -not -path "./.git/*" \
            -not -path "*/target/*"

          if ! find . -type f -name "*.java" \
            -not -path "./.git/*" \
            -not -path "*/target/*" | grep -q .; then
            echo "::error::Keine Java-Dateien gefunden!"
            exit 1
          fi

      - name: Prepare Project
        run: |
          mkdir -p output/TreasureHunt

          rsync -a ./ output/TreasureHunt/ \
            --exclude='.git/' \
            --exclude='target/' \
            --exclude='output/' \
            --exclude='*.jar' \
            --exclude='*.class'

      - name: Verify Java Files in Package
        run: |
          find output/TreasureHunt -name "*.java"

          COUNT=$(find output/TreasureHunt -name "*.java" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Java-Dateien fehlen in der ZIP!"
            exit 1
          fi

          echo "$COUNT Java-Dateien gefunden."

      - name: Create ZIP
        run: |
          cd output
          zip -qr ../TreasureHunt-Source.zip TreasureHunt

      - name: Verify ZIP
        run: |
          unzip -l TreasureHunt-Source.zip

          unzip -Z1 TreasureHunt-Source.zip | grep -E '\.java$'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-Source
          path: TreasureHunt-Source.zip
          if-no-files-found: error
          retention-days: 30
