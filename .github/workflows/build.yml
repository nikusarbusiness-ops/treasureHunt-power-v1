
name: Build TreasureHunt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin and Source ZIP
    runs-on: ubuntu-latest

    steps:
      # Repository herunterladen
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 21 einrichten
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Projektverzeichnis automatisch finden
      - name: Find Maven project
        id: project
        shell: bash
        run: |
          POM="$(find . -name pom.xml -not -path '*/target/*' -print -quit)"

          if [ -z "$POM" ]; then
            echo "FEHLER: Keine pom.xml gefunden!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$POM")"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gefundenes Projekt: $PROJECT_DIR"

      # Prüfen, ob Java-Quellen und Ressourcen vorhanden sind
      - name: Check project files
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"

          if ! find "$PROJECT/src/main/java" -name "*.java" -print -quit | grep -q .; then
            echo "FEHLER: Keine Java-Quelldateien gefunden!"
            exit 1
          fi

          if [ ! -f "$PROJECT/src/main/resources/plugin.yml" ]; then
            echo "FEHLER: plugin.yml fehlt!"
            exit 1
          fi

          echo "Java-Quelldateien und plugin.yml gefunden."

      # Maven-Build ausführen
      - name: Build with Maven
        working-directory: ${{ steps.project.outputs.dir }}
        run: mvn --batch-mode --no-transfer-progress clean package

      # Kompilierte Plugin-JAR überprüfen
      - name: Verify compiled plugin
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"
          TARGET="$PROJECT/target"
          JAR="$TARGET/TreasureHunt-1.0.0.jar"

          if [ ! -f "$JAR" ]; then
            echo "FEHLER: TreasureHunt-1.0.0.jar wurde nicht erstellt!"
            echo "Inhalt des target-Ordners:"
            ls -lah "$TARGET" || true
            exit 1
          fi

          if ! jar tf "$JAR" | grep -q "plugin.yml"; then
            echo "FEHLER: plugin.yml fehlt in der Plugin-JAR!"
            exit 1
          fi

          if ! jar tf "$JAR" | grep -q "de/powersmp/treasurehunt/TreasureHuntPlugin.class"; then
            echo "FEHLER: Hauptklasse fehlt in der Plugin-JAR!"
            exit 1
          fi

          echo "Plugin-JAR erfolgreich überprüft!"

      # Ausgabedateien vorbereiten
      - name: Prepare release files
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.dir }}"

          mkdir -p dist

          # Fertige Plugin-JAR
          cp "$PROJECT/target/TreasureHunt-1.0.0.jar" \
             "dist/TreasureHunt.jar"

          # Vollständiges Source-Projekt als ZIP
          cd "$PROJECT"

          zip -r "$GITHUB_WORKSPACE/dist/TreasureHunt-Source.zip" . \
            -x "*/target/*" \
               "*/.git/*" \
               "*/.github/*"

          echo "Fertig gepackt:"
          ls -lah "$GITHUB_WORKSPACE/dist"

      # Beide Dateien als GitHub-Artefakte hochladen
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-Release
          path: dist/
          if-no-files-found: error
          retention-days: 30
