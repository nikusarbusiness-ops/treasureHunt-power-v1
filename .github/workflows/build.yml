
name: TreasureHunt - ZIP Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate and Package TreasureHunt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find Maven Project
        id: project
        shell: bash
        run: |
          POM=$(find . -type f -name pom.xml \
            -not -path './.git/*' \
            -not -path '*/target/*' \
            -print -quit)

          if [ -z "$POM" ]; then
            echo "::error::Keine pom.xml im Repository gefunden!"
            echo "Repository-Dateien:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Gefunden: $POM"
          echo "pom=$POM" >> "$GITHUB_OUTPUT"

      - name: Validate Maven Project
        run: |
          mvn -B -ntp -f "${{ steps.project.outputs.pom }}" validate

      - name: Prepare Complete Source Project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/staging/TreasureHunt"

          rsync -a "$GITHUB_WORKSPACE/" \
            "$RUNNER_TEMP/staging/TreasureHunt/" \
            --exclude='.git/' \
            --exclude='*/.git/' \
            --exclude='target/' \
            --exclude='*/target/' \
            --exclude='dist/' \
            --exclude='*/dist/' \
            --exclude='*.jar' \
            --exclude='*.class' \
            --exclude='.idea/' \
            --exclude='.vscode/'

      - name: Verify ZIP Contents
        shell: bash
        run: |
          PROJECT="$RUNNER_TEMP/staging/TreasureHunt"

          test -f "$PROJECT/${{ steps.project.outputs.pom }}" || \
            test -f "$PROJECT/pom.xml"

          echo "Projektdateien:"
          find "$PROJECT" -type f | sort

          if find "$PROJECT" -type f \
            \( -name '*.jar' -o -name '*.class' \) | grep -q .; then
            echo "::error::Kompilierte Dateien gefunden!"
            exit 1
          fi

          echo "ZIP-Inhalt erfolgreich geprüft."

      - name: Create Final ZIP
        run: |
          cd "$RUNNER_TEMP/staging"

          zip -qr \
            "$RUNNER_TEMP/TreasureHunt-Source.zip" \
            TreasureHunt

      - name: Verify Final ZIP
        run: |
          ZIP="$RUNNER_TEMP/TreasureHunt-Source.zip"

          test -s "$ZIP"
          unzip -t "$ZIP"

          echo "ZIP erfolgreich erstellt:"
          ls -lh "$ZIP"

      - name: Upload Final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-Source
          path: ${{ runner.temp }}/TreasureHunt-Source.zip
          if-no-files-found: error
          retention-days: 30
