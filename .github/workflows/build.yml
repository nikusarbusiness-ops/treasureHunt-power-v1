
name: Build Plugin and Source ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin and Source ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check project files
        run: |
          set -e
          test -f pom.xml
          test -f TreasureHuntPlugin.java
          test -f plugin.yml

      - name: Fix Java compatibility issues
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          file = Path("TreasureHuntPlugin.java")
          source = file.read_text(encoding="utf-8")

          old_actionbar = 'p.sendActionBar(color("&6"+subtitle));'
          new_actionbar = (
              'p.spigot().sendMessage('
              'net.md_5.bungee.api.ChatMessageType.ACTION_BAR, '
              'net.md_5.bungee.api.chat.TextComponent.fromLegacyText('
              'color("&6"+subtitle)));'
          )

          if old_actionbar not in source:
              raise SystemExit("Fehler: Actionbar-Stelle nicht gefunden.")

          source = source.replace(old_actionbar, new_actionbar)
          source = source.replace("new Date(", "new java.util.Date(")

          file.write_text(source, encoding="utf-8")
          print("Java-Kompatibilitätskorrekturen angewendet.")
          PY

      - name: Prepare Maven project
        shell: bash
        run: |
          set -e
          rm -rf src/main
          mkdir -p src/main/java/de/powersmp/treasurehunt
          mkdir -p src/main/resources

          cp TreasureHuntPlugin.java \
            src/main/java/de/powersmp/treasurehunt/

          cp plugin.yml src/main/resources/
          [ ! -f config.yml ] || cp config.yml src/main/resources/
          [ ! -f messages.yml ] || cp messages.yml src/main/resources/

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify plugin JAR
        shell: bash
        run: |
          set -e
          JAR="target/TreasureHunt-1.0.0.jar"

          test -f "$JAR"
          jar tf "$JAR" | grep -q "plugin.yml"
          jar tf "$JAR" | grep -q \
            "de/powersmp/treasurehunt/TreasureHuntPlugin.class"

          echo "Plugin erfolgreich kompiliert und überprüft."

      - name: Create ZIP files
        shell: bash
        run: |
          set -e
          mkdir -p dist

          cp target/TreasureHunt-1.0.0.jar \
            dist/TreasureHunt.jar

          zip -r dist/TreasureHunt-Source.zip . \
            -x "./.git/*" \
               "./target/*" \
               "./dist/*"

          echo "Erstellte Dateien:"
          ls -lh dist/

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-Release
          path: dist/
          if-no-files-found: error
          retention-days: 30
