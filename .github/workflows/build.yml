
name: Build Plugin and Source ZIP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin and Source ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Projektdateien in die Maven-Ordnerstruktur kopieren
      - name: Prepare Maven project structure
        shell: bash
        run: |
          set -e

          if [ ! -f pom.xml ]; then
            echo "FEHLER: pom.xml fehlt im Hauptverzeichnis!"
            exit 1
          fi

          if [ ! -f TreasureHuntPlugin.java ]; then
            echo "FEHLER: TreasureHuntPlugin.java fehlt!"
            exit 1
          fi

          if [ ! -f plugin.yml ]; then
            echo "FEHLER: plugin.yml fehlt!"
            exit 1
          fi

          mkdir -p src/main/java/de/powersmp/treasurehunt
          mkdir -p src/main/resources

          cp TreasureHuntPlugin.java \
            src/main/java/de/powersmp/treasurehunt/TreasureHuntPlugin.java

          cp plugin.yml src/main/resources/plugin.yml

          if [ -f config.yml ]; then
            cp config.yml src/main/resources/config.yml
          fi

          if [ -f messages.yml ]; then
            cp messages.yml src/main/resources/messages.yml
          fi

          echo "Maven-Projektstruktur erfolgreich vorbereitet."
          find src/main -type f

      # Maven kompilieren
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      # JAR überprüfen
      - name: Verify compiled plugin
        shell: bash
        run: |
          set -e

          JAR="target/TreasureHunt-1.0.0.jar"

          if [ ! -f "$JAR" ]; then
            echo "FEHLER: Plugin-JAR wurde nicht erstellt!"
            ls -lah target || true
            exit 1
          fi

          if ! jar tf "$JAR" | grep -q "plugin.yml"; then
            echo "FEHLER: plugin.yml fehlt in der JAR!"
            exit 1
          fi

          if ! jar tf "$JAR" | grep -q "de/powersmp/treasurehunt/TreasureHuntPlugin.class"; then
            echo "FEHLER: Hauptklasse fehlt in der JAR!"
            exit 1
          fi

          echo "Plugin-JAR erfolgreich überprüft!"

      # Release-Dateien erstellen
      - name: Prepare release files
        shell: bash
        run: |
          set -e

          mkdir -p dist

          cp target/TreasureHunt-1.0.0.jar dist/TreasureHunt.jar

          zip -r dist/TreasureHunt-Source.zip . \
            -x "./.git/*" \
               "./target/*" \
               "./dist/*"

          echo "Erstellte Dateien:"
          ls -lah dist

      # Dateien zum Download bereitstellen
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-Release
          path: dist/
          if-no-files-found: error
          retention-days: 30
