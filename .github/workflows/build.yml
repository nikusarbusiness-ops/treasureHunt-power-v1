
name: TreasureHunt - Build ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Project Structure
        run: |
          test -f pom.xml
          test -d src/main/java
          test -f src/main/resources/plugin.yml
          test -f src/main/resources/config.yml
          test -f src/main/resources/messages.yml
          test -f README.md

      - name: Maven Test
        run: mvn -B -ntp test

      - name: Prepare ZIP
        run: |
          mkdir -p dist/staging/TreasureHunt

          rsync -a ./ dist/staging/TreasureHunt/ \
            --exclude='.git/' \
            --exclude='target/' \
            --exclude='dist/' \
            --exclude='*.jar' \
            --exclude='.idea/' \
            --exclude='.vscode/'

      - name: Create Source ZIP
        run: |
          cd dist/staging
          zip -qr ../TreasureHunt-Source.zip TreasureHunt

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TreasureHunt-Source
          path: dist/TreasureHunt-Source.zip
          if-no-files-found: error
          retention-days: 30
